name: ribhu-phase0-ci

on:
  pull_request:
  push:
    branches:
      - ribhu-main

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  CARGO_INCREMENTAL: "0"

jobs:
  validate-linux:
    name: ubuntu-latest
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 500ms
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          clean: false

      - name: Install Linux dependencies
        run: ./script/linux

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Set up CI cargo config
        shell: bash
        run: |
          mkdir -p ../.cargo
          cp ./.cargo/ci-config.toml ../.cargo/config.toml

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets

      - name: workspace tests
        run: cargo nextest run --workspace --no-fail-fast

      - name: Free disk before release build
        run: |
          rm -rf target/debug target/.nextest target/tmp
          df -h

      - name: cargo build --release
        run: cargo build --release

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ribhu-ubuntu-latest-release
          if-no-files-found: warn
          path: |
            target/release/zed
            target/release/zed.exe

  validate-macos:
    name: macos-latest
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          clean: false

      - name: Install macOS dependencies
        run: brew install cmake

      - name: Export macOS SDK path
        run: echo "BINDGEN_EXTRA_CLANG_ARGS=--sysroot=$(xcrun --show-sdk-path)" >> "$GITHUB_ENV"

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Set up CI cargo config
        shell: bash
        run: |
          mkdir -p ../.cargo
          cp ./.cargo/ci-config.toml ../.cargo/config.toml

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets

      - name: workspace tests
        run: cargo nextest run --workspace --no-fail-fast

      - name: Free macOS disk before release build
        run: |
          rm -rf target/debug target/.nextest target/tmp
          rm -rf "$HOME/.cargo/registry/cache"
          rm -rf "$HOME/Library/Caches/Homebrew" || true
          df -h

      - name: cargo build --release
        run: cargo build --release

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ribhu-macos-latest-release
          if-no-files-found: warn
          path: |
            target/release/zed
            target/release/zed.exe

  validate-windows:
    name: windows-latest
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          clean: false

      - name: Configure Git long paths
        shell: pwsh
        run: git config --global core.longpaths true

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64

      - name: Locate Windows RC toolkit
        shell: pwsh
        run: |
          $rc = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Filter rc.exe -Recurse |
            Where-Object { $_.FullName -match '\\x64\\rc\.exe$' } |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $rc) {
            throw "Unable to locate rc.exe"
          }
          "ZED_RC_TOOLKIT_PATH=$($rc.DirectoryName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Set up CI cargo config
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "..\.cargo" -Force | Out-Null
          Copy-Item ".\.cargo\ci-config.toml" "..\.cargo\config.toml" -Force

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets

      - name: workspace tests
        shell: pwsh
        run: cargo nextest run --workspace --no-fail-fast

      - name: cargo build --release
        shell: pwsh
        run: cargo build --release

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ribhu-windows-latest-release
          if-no-files-found: warn
          path: |
            target/release/zed
            target/release/zed.exe
